<!DOCTYPE html>
<html>
<head>
    <title>Market Fiyatı Agent Chat</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #3F5FD5;
            text-align: center;
            margin-bottom: 20px;
        }

        #chat-box { 
            height: 400px;
            background-color: #2c2c2c;
            border: 1px solid #404040;
            border-radius: 8px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
        }

        #chat-box p {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            white-space: pre-line;
        }

        #chat-box p:nth-child(odd) {
            background-color: #363636;
        }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #input { 
            flex: 1;
            padding: 10px;
            border: 1px solid #404040;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: #ffffff;
        }

        button { 
            padding: 10px 20px;
            background-color: #3F5FD5;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #3F5FD5;
        }

        #input:focus {
            outline: none;
            border-color: #3F5FD5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2c2c2c;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Market Fiyatı Agent Chat</h1>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="input" placeholder="Mesajınızı yazın">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('input');
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;
            
            chatBox.innerHTML += '<p><strong>Siz:</strong> ' + input.value + '</p>';
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: input.value })
                });
                const data = await response.json();
                chatBox.innerHTML += '<p><strong>Agent:</strong> ' + (data.yanıt || data.hata) + '</p>';
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += '<p style="color:red;">Hata: ' + error.message + '</p>';
            }
        }

        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
